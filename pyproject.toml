[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sargent"
version = "0.0.1"
description = "Sargent: a chemical process simulator (sequential modular and equation oriented) with TEA and LCA - under development"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Damdae Park"}]
classifiers = [
    "License :: Other/Proprietary License",
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/damdaepark/sargent"

[tool.setuptools.packages.find]
where = ["src"]
